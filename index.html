<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <main>
        <header>
            <h1 class="title">📚 Library</h1>
            <button type="button" id="add-btn">+ Add Book</button>
        </header>

        <section class="content" id="library">
            <!-- JS adds cards here, e.g.
            <article class="card">
                <h2 class="card-title">Book title</h2>
                <p class="card-author">by Author</p>
                <p class="card-pages">320 pages</p>
                <div class="card-actions">
                    <button class="read-btn">Read</button>
                    <button class="remove-btn">Remove</button>
                </div>
            </article>
            -->
        </section>
    </main>

    <dialog id="book-dialog">
        <form id="book-form" method="dialog">
            <h2>Add a new book</h2>

            <label for="title">Title</label>
            <input type="text" id="title" name="title" required>

            <label for="author">Author</label>
            <input type="text" id="author" name="author" required>

            <label for="pages">Pages</label>
            <input type="number" id="pages" name="pages" min="1" required>

            <label class="checkbox">
                <input type="checkbox" id="read-status" name="readStatus">
                I have read this book
            </label>

            <div class="form-actions">
                <button type="button" id="cancel-btn" class="cancel-btn">Cancel</button>
                <button type="submit">Add</button>
            </div>
        </form>
    </dialog>

    <script src="app.js"></script>
</body>
</html>
